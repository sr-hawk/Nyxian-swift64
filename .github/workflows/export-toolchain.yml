name: Export toolchain

# Manual. Restores the cached CoreCompilerSupportLibs (LLVM/clang/Swift/swift-syntax built from
# open source by build.yml) and publishes them as the "toolchain" release asset, so a private
# copy of this repository can build in minutes instead of rebuilding the toolchain for hours.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SWIFT_BRANCH: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-09-04-a
  LLVM_TARGETS: "AArch64;ARM"
  CACHE_EPOCH: v2

jobs:
  export:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Resolve toolchain cache key
        id: tc
        run: |
          set -e
          SHA=$(git -C LLVM-On-iOS rev-parse HEAD)
          TARGETS_SLUG=$(echo "$LLVM_TARGETS" | tr ';' '-')
          echo "key=ccsl-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ env.SWIFT_BRANCH }}-$TARGETS_SLUG-$SHA" >> "$GITHUB_OUTPUT"
      - name: Restore CoreCompiler support libs
        id: ccsl
        uses: actions/cache/restore@v6
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.tc.outputs.key }}
          fail-on-cache-miss: true
      - name: Pack
        run: |
          set -euo pipefail
          brew install zstd >/dev/null 2>&1 || true
          tar --zstd -cf CoreCompilerSupportLibs.tar.zst -C Frameworks/CoreCompiler CoreCompilerSupportLibs
          ls -la CoreCompilerSupportLibs.tar.zst
          echo "${{ steps.tc.outputs.key }}" > toolchain.key
      - name: Publish as release asset "toolchain"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view toolchain --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create toolchain --repo "$GITHUB_REPOSITORY" --title "toolchain" \
                 --notes "CoreCompilerSupportLibs built from open source by build.yml (LLVM/clang/Swift/swift-syntax for iOS). Consumed by build.yml when the cache is empty." --latest=false
          gh release upload toolchain CoreCompilerSupportLibs.tar.zst toolchain.key --repo "$GITHUB_REPOSITORY" --clobber
