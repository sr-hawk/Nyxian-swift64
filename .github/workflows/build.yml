name: Build iOS App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Swift snapshot the LLVM-On-iOS toolchain is built from.
  SWIFT_BRANCH: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-09-04-a
  # LLVM backends to build. Upstream build-script defaults to
  # X86;ARM;AArch64;PowerPC;SystemZ;Mips;RISCV;WebAssembly;AVR;BPF.
  # The final compiler only targets arm64 (AArch64), but the ARM (32-bit)
  # backend is ALSO required at build time: this toolchain force-builds
  # compiler-rt baremetal macho_embedded builtins for armv6/armv6m/armv7/
  # armv7m/armv7em/armv8m.main/armv8.1m.main (see
  # COMPILER_RT_FORCE_BUILD_BAREMETAL_MACHO_BUILTINS_ARCHS), and the just-built
  # clang must have the ARM backend to assemble those. AArch64 alone fails
  # with "clang -arch armv6m ... udivsi3.S" -> code 1. So AArch64;ARM is the
  # minimum; the other 8 upstream backends stay dropped.
  # This value is part of the cache key, so changing it rebuilds automatically.
  LLVM_TARGETS: AArch64;ARM
  # Bump to throw away a bad toolchain cache without touching anything else.
  # v2 -> v3 (2026-09): the Makefile's CoreCompilerSupportLibs rule now also
  # copies lib/swift/host/compiler's .swiftmodule/.swiftdoc/.swiftinterface
  # files (needed to build the SwiftUIMacros plugin against _CompilerSwift*)
  # alongside the dylibs it already bundled. That cache directory is content
  # from a run before this change, so the key must change too or the cache
  # hit skips the whole toolchain build and the plugin has nothing to link.
  # One-time cost: a full LLVM-On-iOS toolchain rebuild (~4-5h) on the next
  # push, same as any other CACHE_EPOCH bump.
  # v3 -> v4 (2026-09-16): v3's fix was necessary but not sufficient --
  # measured live on CI run 35050516832, "unable to resolve module
  # dependency" persisted even with the .swiftmodule files present and
  # -I wired correctly, because they're binary modules locked to the
  # snapshot compiler that built them, not Xcode's swiftc (see the
  # Makefile's own NOTE above build-swiftui-macros-plugin.sh). The
  # NyxianMacros Xcode target is gone; the Makefile now compiles
  # libSwiftUIMacros.dylib directly into CoreCompilerSupportLibs/ with a
  # macOS-executable swiftc from that same snapshot build (a NEW file in
  # the cached directory), so the cache key must change again or a hit
  # restores a directory with no libSwiftUIMacros.dylib in it at all.
  # v4 -> v5 (2026-09-16, same day): v4's own diagnostic proved the real
  # problem -- host-compiler-modules/ contains ONLY *.dylib files for the
  # four _Compiler* modules, no .swiftmodule/.swiftinterface at all, on
  # ANY host. "no such module '_CompilerSwiftDiagnostics'" (not a version
  # mismatch) confirmed it: there was never anything to read, at any
  # compiler version. Fix: build the actual swift-syntax source (fetched
  # as LLVM-On-iOS/swift-syntax by the toolchain build itself) with
  # -module-alias so it type-checks under the same mangled names as the
  # shipped dylibs -- see build-plugin-swift-syntax-modules.sh. Its
  # outputs (a cached macOS swiftc copy + the built .swiftmodule files)
  # are new files in the cached directory, so the key changes again.
  # v5 -> v6 (2026-09-16, same day): v5's cached swiftc copy was itself
  # broken. Measured live, CI run 35094974426: `cp -a` of just
  # host-swiftc-macos/bin/ produced a swiftc that launched (printed its own
  # "Unable to locate libSwiftScan" fallback notice -- not a dyld crash)
  # but then failed `-version` outright -- "relocation broke it". The v5
  # cache ALREADY has this broken copy saved (Save CoreCompiler support
  # libs runs `if: always()`, so it saved even though the job failed), so
  # a v5 cache HIT would keep serving the same broken swiftc forever --
  # Stage A (which does the copying) only runs inside the
  # no-prerequisites CoreCompilerSupportLibs directory recipe, so it does
  # NOT rerun on a cache hit. This bump is therefore unavoidable, not
  # optional: there is no cheap path to a working cached swiftc from here.
  # Fix (build-plugin-swift-syntax-modules.sh): copy the same
  # bin/include/share/lib-swift/lib-cmake/top-level-libs subset (plus
  # `materialize_required_symlinks` for bin/swiftc -> swift-driver) that
  # LLVM-On-iOS's OWN `Scripts/build-swift-toolchain.sh`
  # `copy_ios_install()` already uses -- proven live in this exact run's
  # log to produce a working relocated copy for the iOS side of the same
  # build; this reuses that recipe verbatim for the macOS host side
  # instead of re-guessing. New content (lib/swift/macosx's dylibs etc.)
  # in the cached directory, so the key must change again.
  CACHE_EPOCH: v6

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest
    # GitHub hard-kills hosted jobs at 6h; stay just under so we fail loudly instead.
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The build-script preset in the LLVM-On-iOS submodule never overrides
      # --llvm-targets-to-build, so it inherits all ten upstream backends. We
      # cannot repoint a submodule from the GitHub web UI, so patch the preset
      # in place after checkout instead. Fails loudly rather than silently
      # no-opping if the preset moves.
      - name: Trim LLVM backends
        run: |
          set -euo pipefail
          python3 - "$LLVM_TARGETS" <<'PY'
          import pathlib, re, sys

          targets = sys.argv[1]
          preset  = "nyxian_iphoneos_arm64_crosscompiler"
          header  = re.compile(r'^\[preset:\s*' + re.escape(preset) + r'\s*\]\s*$')
          # Unindented key line only: indented lines are continuations of a
          # multi-line value such as extra-cmake-options.
          existing = re.compile(r'^llvm-targets-to-build\s*=')
          nextsect = re.compile(r'^\[')

          hits = []
          for path in sorted(pathlib.Path("LLVM-On-iOS").rglob("*")):
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              try:
                  lines = path.read_text(encoding="utf-8").split("\n")
              except (UnicodeDecodeError, OSError):
                  continue
              idx = next((i for i, l in enumerate(lines) if header.match(l)), None)
              if idx is None:
                  continue

              end = next((j for j in range(idx + 1, len(lines))
                          if nextsect.match(lines[j])), len(lines))
              body = [l for l in lines[idx + 1:end] if not existing.match(l)]
              lines[idx + 1:end] = ["llvm-targets-to-build=" + targets] + body
              path.write_text("\n".join(lines), encoding="utf-8")
              hits.append(str(path))

          if not hits:
              sys.exit(
                  "ERROR: preset [preset: %s] not found anywhere under LLVM-On-iOS/.\n"
                  "The preset was renamed or moved. Find the new name in the build log\n"
                  "line beginning '[utils/build-script] NOTE: using preset' and update\n"
                  "the 'preset' variable in this step." % preset)

          print("patched llvm-targets-to-build=%s in: %s" % (targets, ", ".join(hits)))
          PY

      - name: Resolve toolchain cache key
        id: tc
        run: |
          set -e
          SHA=$(git -C LLVM-On-iOS rev-parse HEAD)
          TARGETS_SLUG=$(echo "$LLVM_TARGETS" | tr ';' '-')
          echo "key=ccsl-${{ env.CACHE_EPOCH }}-${{ runner.os }}-${{ env.SWIFT_BRANCH }}-$TARGETS_SLUG-$SHA" >> "$GITHUB_OUTPUT"

      # The Makefile treats Frameworks/CoreCompiler/CoreCompilerSupportLibs as a
      # directory target with no prerequisites: if it already exists, the whole
      # multi-hour LLVM + Swift toolchain build is skipped.
      - name: Restore CoreCompiler support libs
        id: ccsl
        uses: actions/cache/restore@v6
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.tc.outputs.key }}

      - name: Install Dependencies
        run: |
          set -e

          # Packages we desperately need
          brew install ldid dpkg libarchive

      - name: Build Nyxian
        run: |
          set -e

          CHECK_DEPS=0 make all

      # Runs even when the app build fails, so a successfully built toolchain is
      # never thrown away because of an unrelated compile error.
      - name: Save CoreCompiler support libs
        if: always() && steps.ccsl.outputs.cache-hit != 'true' && hashFiles('Frameworks/CoreCompiler/CoreCompilerSupportLibs/**') != ''
        uses: actions/cache/save@v6
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.tc.outputs.key }}

      - name: Upload Nyxian
        uses: actions/upload-artifact@v7
        with:
          name: Nyxian-${{ env.VERSION }}
          path: Nyxian.ipa
          archive: false
          if-no-files-found: error
